<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>URL Shortener</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white w-full max-w-xl rounded-2xl shadow-lg p-8">

    <div class="text-center">

        <div class="text-5xl">
            🔗
        </div>

        <h1 class="text-3xl font-bold text-gray-800 mt-3">

            URL Shortener

        </h1>

        <p class="text-gray-500 mt-2">

            Shorten your long URLs instantly.

        </p>

    </div>

    <div class="mt-8">

        <label
                class="block font-medium text-gray-700 mb-2">

            Enter URL

        </label>

        <input

                id="longURL"

                type="text"

                placeholder="https://www.example.com/..."

                class="w-full border border-gray-300 rounded-lg
                       px-4 py-3
                       focus:outline-none
                       focus:ring-2
                       focus:ring-gray-800">

    </div>

    <button

            id="shortenBtn"

            class="w-full mt-6 bg-gray-900
                   hover:bg-black
                   text-white
                   font-semibold
                   py-3
                   rounded-lg
                   transition">

        Shorten URL

    </button>

    <div

            id="resultCard"

            class="hidden mt-8 border rounded-lg p-5 bg-gray-50">

        <p class="text-gray-500 text-sm">

            Short URL

        </p>

        <a

                id="shortLink"

                target="_blank"

                class="text-blue-600
                       hover:underline
                       break-all
                       font-medium">

        </a>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
